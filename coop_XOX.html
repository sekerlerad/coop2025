<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Çevrim İçi XOX</title>
  <style>
    body { text-align:center; background:#111; color:white; font-family:Arial; }
    h1 { margin-top:30px; }
    #board {
      width:300px;
      margin:20px auto;
      display:grid;
      grid-template-columns:repeat(3, 100px);
      gap:5px;
    }
    .cell {
      width:100px; height:100px;
      background:#222;
      font-size:60px;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      border-radius:10px;
      user-select:none;
    }
    .cell:hover { background:#333; }
    #status { margin-top:10px; }
    button { margin:5px; padding:8px 14px; }
  </style>

  <!-- Firebase compat scriptleri (global firebase değişkeni verir) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // Firebase ayarların
    const firebaseConfig = {
      apiKey: "AIzaSyDX0wA69-G_EnDIOXnQZlEfaD6lsQEkJ_k",
      authDomain: "coop2025-93420.firebaseapp.com",
      projectId: "coop2025-93420",
      storageBucket: "coop2025-93420.firebasestorage.app",
      messagingSenderId: "671774331816",
      appId: "1:671774331816:web:138d0d76ad4d2c7e16439d",
      measurementId: "G-2Z4SYD5NBL",
      databaseURL: "https://coop2025-93420-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    // Firebase başlat
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Oda / tahta referansı
    const roomRef = db.ref("oda1");
    const boardRef = roomRef.child("board");

    let board = ["","","","","","","","",""];
    let mySymbol = ""; // "X" veya "O"

    // Sayfa açılınca tahtayı dinle
    boardRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        board = data;
      }
      refreshBoard();
    });

    function refreshBoard() {
      for (let i = 0; i < 9; i++) {
        const cell = document.getElementById("c" + i);
        cell.innerText = board[i] || "";
      }
    }

    // Sembol seçme
    function chooseSymbol(symbol) {
      mySymbol = symbol;
      document.getElementById("status").innerText =
        "Sen: " + mySymbol + "   |  Diğer kişi de diğer harfi seçsin.";
    }

    // Hücreye tıklama
    function playCell(index) {
      if (!mySymbol) {
        alert("Önce X veya O seç.");
        return;
      }
      if (board[index] !== "") {
        return; // dolu hücre
      }
      board[index] = mySymbol;
      boardRef.set(board); // herkesin tahtası güncellenir
    }
  </script>
</head>
<body>
  <h1>Çevrim İçi XOX</h1>

  <div>
    <button onclick="chooseSymbol('X')">X olarak oyna</button>
    <button onclick="chooseSymbol('O')">O olarak oyna</button>
  </div>

  <div id="status">Önce X veya O seç.</div>

  <div id="board">
    <div class="cell" id="c0" onclick="playCell(0)"></div>
    <div class="cell" id="c1" onclick="playCell(1)"></div>
    <div class="cell" id="c2" onclick="playCell(2)"></div>
    <div class="cell" id="c3" onclick="playCell(3)"></div>
    <div class="cell" id="c4" onclick="playCell(4)"></div>
    <div class="cell" id="c5" onclick="playCell(5)"></div>
    <div class="cell" id="c6" onclick="playCell(6)"></div>
    <div class="cell" id="c7" onclick="playCell(7)"></div>
    <div class="cell" id="c8" onclick="playCell(8)"></div>
  </div>

  <p>Linki sevgiline gönderin; biri X, diğeri O seçip aynı tahtada oynayabilirsiniz.</p>
</body>
</html>
