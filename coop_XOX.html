<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>XOX Oyunu</title>
  <style>
    body {
      text-align: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    h1 {
      margin-top: 30px;
    }
    #board {
      width: 300px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 5px;
    }
    .cell {
      width: 100px;
      height: 100px;
      background: #222;
      font-size: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }
    .cell:active {
      background: #333;
    }
    #status {
      margin-top: 10px;
      font-size: 18px;
    }
    button {
      margin-top: 10px;
      padding: 8px 14px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      background: #0a84ff;
      color: #fff;
      cursor: pointer;
    }
    button:active {
      background: #0060c9;
    }
  </style>

  <script>
    let board = ["","","","","","","","",""];
    let currentPlayer = "X";
    let gameOver = false;

    const winLines = [
      [0,1,2], [3,4,5], [6,7,8], // yatay
      [0,3,6], [1,4,7], [2,5,8], // dikey
      [0,4,8], [2,4,6]           // çapraz
    ];

    function refreshBoard() {
      for (let i = 0; i < 9; i++) {
        document.getElementById("c" + i).innerText = board[i];
      }
    }

    function checkWin(player) {
      return winLines.some(line =>
        line.every(idx => board[idx] === player)
      );
    }

    function playCell(index) {
      if (gameOver) return;
      if (board[index] !== "") return;

      board[index] = currentPlayer;
      refreshBoard();

      if (checkWin(currentPlayer)) {
        document.getElementById("status").innerText =
          currentPlayer + " kazandı!";
        gameOver = true;
        return;
      }

      if (board.every(cell => cell !== "")) {
        document.getElementById("status").innerText = "Berabere!";
        gameOver = true;
        return;
      }

      currentPlayer = (currentPlayer === "X") ? "O" : "X";
      document.getElementById("status").innerText =
        "Sıra: " + currentPlayer;
    }

    function resetGame() {
      board = ["","","","","","","","",""];
      currentPlayer = "X";
      gameOver = false;
      refreshBoard();
      document.getElementById("status").innerText = "Sıra: X";
    }

    window.onload = resetGame;
  </script>
</head>
<body>
  <h1>XOX Oyunu</h1>

  <div id="status">Sıra: X</div>

  <div id="board">
    <div class="cell" id="c0" onclick="playCell(0)"></div>
    <div class="cell" id="c1" onclick="playCell(1)"></div>
    <div class="cell" id="c2" onclick="playCell(2)"></div>
    <div class="cell" id="c3" onclick="playCell(3)"></div>
    <div class="cell" id="c4" onclick="playCell(4)"></div>
    <div class="cell" id="c5" onclick="playCell(5)"></div>
    <div class="cell" id="c6" onclick="playCell(6)"></div>
    <div class="cell" id="c7" onclick="playCell(7)"></div>
    <div class="cell" id="c8" onclick="playCell(8)"></div>
  </div>

  <button onclick="resetGame()">Yeniden Başlat</button>

  <p>Aynı telefondan iki kişi sırayla X ve O oynayabilir.</p>
</body>
</html>
