<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>XO Çift Oyuncu</title>
    <style>
        body { 
            font-family: Arial; 
            text-align: center; 
            margin-top: 40px; 
        }
        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            margin: auto;
            width: 320px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background: #eee;
            font-size: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #status { margin-top: 20px; font-size: 20px;}
    </style>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

        // Firebase CONFIG (seninki)
        const firebaseConfig = {
            apiKey: "AIzaSyDX0wA69-G_EnDIOXnQZlEfaD6lsQEkJ_k",
            authDomain: "coop2025-93420.firebaseapp.com",
            projectId: "coop2025-93420",
            storageBucket: "coop2025-93420.firebasestorage.app",
            messagingSenderId: "671774331816",
            appId: "1:671774331816:web:138d0d76ad4d2c7e16439d",
            measurementId: "G-2Z4SYD5NBL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const room = "global_room"; // oda kodu YOK, HERKES AYNI ODADA

        let player = null;
        let currentTurn = "X";

        const boardRef = ref(db, room + "/board");
        const turnRef = ref(db, room + "/turn");
        const playersRef = ref(db, room + "/players");

        // Yeni katılan oyuncuya X veya O ata
        onValue(playersRef, (snap) => {
            let players = snap.val();

            if (!players) {
                set(playersRef, { p1: "X" });
                player = "X";
            } else if (!players.p2) {
                set(playersRef, { p1: "X", p2: "O" });
                player = "O";
            } else if (!player) {
                player = "X"; // 3. kişi gelse bile izleyici olur
            }

            updateStatus();
        });

        // Tahta verisini dinle
        onValue(boardRef, (snap) => {
            const data = snap.val();
            if (data) {
                loadBoard(data);
            }
        });

        // Sıra takibi
        onValue(turnRef, (snap) => {
            currentTurn = snap.val() || "X";
            updateStatus();
        });

        function updateStatus() {
            const s = document.getElementById("status");
            s.innerHTML = "Sen: " + player + " | Sıra: " + currentTurn;
        }

        // Tahtayı tıkla
        function clickCell(i) {
            if (player !== currentTurn) return;

            boardRef.once = null;

            onValue(boardRef, (snap) => {
                let board = snap.val() || ["", "", "", "", "", "", "", "", ""];

                if (board[i] !== "") return;

                board[i] = player;

                set(boardRef, board);
                set(turnRef, player === "X" ? "O" : "X");
            }, { onlyOnce: true });
        }

        // Tahtayı yükle
        function loadBoard(board) {
            for (let i = 0; i < 9; i++) {
                document.getElementById("c" + i).innerHTML = board[i];
            }
        }
    </script>

</head>
<body>

<h2>Gerçek Zamanlı XO Oyunu</h2>

<div id="board">
    <div class="cell" id="c0" onclick="clickCell(0)"></div>
    <div class="cell" id="c1" onclick="clickCell(1)"></div>
    <div class="cell" id="c2" onclick="clickCell(2)"></div>
    <div class="cell" id="c3" onclick="clickCell(3)"></div>
    <div class="cell" id="c4" onclick="clickCell(4)"></div>
    <div class="cell" id="c5" onclick="clickCell(5)"></div>
    <div class="cell" id="c6" onclick="clickCell(6)"></div>
    <div class="cell" id="c7" onclick="clickCell(7)"></div>
    <div class="cell" id="c8" onclick="clickCell(8)"></div>
</div>

<div id="status"></div>

</body>
</html>
