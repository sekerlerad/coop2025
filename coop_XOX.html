<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online XOX - Coop 2025</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: radial-gradient(circle at top, #2a2a72, #000);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 24px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    #subtitle {
      font-size: 13px;
      color: #bbbbff;
      margin-bottom: 8px;
    }

    #gameCard {
      background: rgba(0, 0, 0, 0.55);
      border-radius: 16px;
      padding: 14px 18px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      max-width: 380px;
      width: 100%;
      box-sizing: border-box;
    }

    #roleRow {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .roleBtn {
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      font-size: 13px;
      cursor: pointer;
      background: #222;
      color: #ddd;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .roleBtn.active {
      background: linear-gradient(90deg, #ff9f0a, #ff375f);
      color: #fff;
      box-shadow: 0 0 10px rgba(255,159,10,0.7);
    }

    #status {
      margin-top: 4px;
      font-size: 15px;
      cursor: pointer;
    }

    #status small {
      display: block;
      font-size: 11px;
      color: #aaaaaa;
    }

    #board {
      width: 100%;
      max-width: 320px;
      margin: 12px auto 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(145deg, #141414, #1f1f1f);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      font-weight: 600;
      color: #e0e0ff;
      box-shadow:
        0 6px 10px rgba(0,0,0,0.6),
        inset 0 0 0 1px rgba(255,255,255,0.03);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
    }

    .cell:active {
      transform: scale(0.97);
      box-shadow:
        0 2px 6px rgba(0,0,0,0.8),
        inset 0 0 0 1px rgba(255,255,255,0.06);
      background: linear-gradient(145deg, #101010, #181818);
    }

    .cell.win {
      background: linear-gradient(145deg, #00c851, #007e33);
      color: #ffffff;
      box-shadow:
        0 0 16px rgba(0, 200, 81, 0.8),
        0 6px 14px rgba(0,0,0,0.9);
    }

    #resetBtn {
      margin-top: 10px;
      padding: 9px 16px;
      font-size: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, #0a84ff, #4c6fff);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(10,132,255,0.6);
    }

    #resetBtn:active {
      transform: scale(0.97);
      box-shadow: 0 3px 8px rgba(10,132,255,0.8);
    }

    #hint {
      font-size: 11px;
      color: #bbbbbb;
      margin-top: 6px;
    }

    #conn {
      margin-top: 8px;
      font-size: 11px;
      color: #999;
    }

    #conn span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      background: #ff3b30;
    }

    #conn.online span {
      background: #4cd964;
    }
  </style>

  <script type="module">
    // Firebase modülleri
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue,
      set
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    // Firebase ayarların
    const firebaseConfig = {
      apiKey: "AIzaSyDX0wA69-G_EnDIOXnQZlEfaD6lsQEkJ_k",
      authDomain: "coop2025-93420.firebaseapp.com",
      projectId: "coop2025-93420",
      storageBucket: "coop2025-93420.firebasestorage.app",
      messagingSenderId: "671774331816",
      appId: "1:671774331816:web:138d0d76ad4d2c7e16439d",
      measurementId: "G-2Z4SYD5NBL",
      databaseURL: "https://coop2025-93420-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Tek oda
    const gameRef = ref(db, "xox/oda1");

    const winLines = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    const defaultState = {
      board: ["","","","","","","","",""],
      currentPlayer: "X",
      gameOver: false,
      winner: "",
      winLine: []
    };

    let localState = structuredClone(defaultState);

    // BU TELEFONUN ROLÜ: "X" veya "O" (seçildikten sonra değişmez)
    let mySymbol = null;

    function render(state) {
      for (let i = 0; i < 9; i++) {
        const cell = document.getElementById("c" + i);
        cell.innerText = state.board[i] || "";
        cell.classList.remove("win");
      }

      if (state.winLine && state.winLine.length === 3) {
        state.winLine.forEach(idx => {
          const cell = document.getElementById("c" + idx);
          cell.classList.add("win");
        });
      }

      const statusEl = document.getElementById("status");
      if (state.gameOver) {
        if (state.winner) {
          statusEl.innerHTML =
            state.winner + " kazandı!<small>Yeniden başlatmak için buraya dokun.</small>";
        } else {
          statusEl.innerHTML =
            "Berabere!<small>Yeniden başlatmak için buraya dokun.</small>";
        }
      } else {
        let meText = mySymbol ? ("Sen: " + mySymbol + " • ") : "";
        statusEl.innerHTML =
          meText + "Sıra: " + state.currentPlayer +
          "<small>Tahtayı sıfırlamak için buraya dokun.</small>";
      }
    }

    function checkWinner(board, player) {
      for (const line of winLines) {
        const [a, b, c] = line;
        if (board[a] === player && board[b] === player && board[c] === player) {
          return line;
        }
      }
      return null;
    }

    async function playCell(index) {
      // Rol seçilmemişse hamle yok
      if (!mySymbol) {
        alert("Önce bu telefonda X mi O mu oynayacağını seç.");
        return;
      }
      if (!localState) return;
      if (localState.gameOver) return;

      // Sıra bende mi?
      if (localState.currentPlayer !== mySymbol) {
        // Sıra karşı tarafta, hamle yapma
        return;
      }

      if (localState.board[index] !== "") return;

      const newState = structuredClone(localState);
      newState.board[index] = newState.currentPlayer;

      const winLine = checkWinner(newState.board, newState.currentPlayer);
      if (winLine) {
        newState.gameOver = true;
        newState.winner = newState.currentPlayer;
        newState.winLine = winLine;
      } else if (newState.board.every(c => c !== "")) {
        newState.gameOver = true;
        newState.winner = "";
        newState.winLine = [];
      } else {
        newState.currentPlayer =
          (newState.currentPlayer === "X") ? "O" : "X";
      }

      await set(gameRef, newState);
    }

    async function resetGame() {
      await set(gameRef, defaultState);
    }

    // Rol seçme: bir kere seçilir, sonra değişmez
    function chooseSymbol(symbol) {
      if (mySymbol && mySymbol !== symbol) {
        alert("Bu telefonda rol zaten: " + mySymbol);
        return;
      }
      mySymbol = symbol;

      const xBtn = document.getElementById("roleX");
      const oBtn = document.getElementById("roleO");
      xBtn.classList.remove("active");
      oBtn.classList.remove("active");

      if (mySymbol === "X") xBtn.classList.add("active");
      if (mySymbol === "O") oBtn.classList.add("active");

      render(localState);
    }

    // Firebase'deki oyunu dinle
    onValue(gameRef, (snapshot) => {
      const data = snapshot.val();
      const connEl = document.getElementById("conn");
      connEl.classList.add("online");
      connEl.innerHTML = "<span></span>Bağlı";

      if (data) {
        localState = data;
      } else {
        localState = structuredClone(defaultState);
        set(gameRef, localState);
      }
      render(localState);
    }, (error) => {
      console.error(error);
      const connEl = document.getElementById("conn");
      connEl.classList.remove("online");
      connEl.innerHTML = "<span></span>Bağlantı hatası";
    });

    // HTML'den erişilebilsin diye global yap
    window.playCell = playCell;
    window.resetGame = resetGame;
    window.chooseSymbol = chooseSymbol;

    window.addEventListener("load", () => {
      const connEl = document.getElementById("conn");
      connEl.innerHTML = "<span></span>Firebase'e bağlanılıyor...";
    });
  </script>
</head>
<body>
  <h1>Online XOX</h1>
  <div id="subtitle">Aynı link → farklı telefonlar → gerçek zamanlı oyun.</div>

  <div id="gameCard">
    <div id="roleRow">
      <button id="roleX" class="roleBtn" onclick="chooseSymbol('X')">Bu telefonda X oynasın</button>
      <button id="roleO" class="roleBtn" onclick="chooseSymbol('O')">Bu telefonda O oynasın</button>
    </div>

    <div id="status" onclick="resetGame()">
      Sıra: X
      <small>Tahtayı sıfırlamak için buraya dokun.</small>
    </div>

    <div id="board">
      <div class="cell" id="c0" onclick="playCell(0)"></div>
      <div class="cell" id="c1" onclick="playCell(1)"></div>
      <div class="cell" id="c2" onclick="playCell(2)"></div>
      <div class="cell" id="c3" onclick="playCell(3)"></div>
      <div class="cell" id="c4" onclick="playCell(4)"></div>
      <div class="cell" id="c5" onclick="playCell(5)"></div>
      <div class="cell" id="c6" onclick="playCell(6)"></div>
      <div class="cell" id="c7" onclick="playCell(7)"></div>
      <div class="cell" id="c8" onclick="playCell(8)"></div>
    </div>

    <button id="resetBtn" onclick="resetGame()">Yeniden Başlat</button>
    <div id="hint">Bir telefonda X tuşuna, diğer telefonda O tuşuna basın. Herkes sadece kendi harfini ve kendi sırası geldiğinde oynar.</div>
    <div id="conn"><span></span>Bağlantı bekleniyor...</div>
  </div>
</body>
</html>
